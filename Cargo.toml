[package]
name = "rustpaint"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "persistence", "wayland", "x11", "wgpu"] }
egui = "0.36.2"
glam = "0.34.1"
half = "2.7.1"
gltf = "1.4.1"
image = "0.25.10"
rfd = "0.17.2"
serde_json = "1.0.152"
wgpu = "30.0.1"

[dev-dependencies]
# Waits on GPU requests in tests that render headlessly.
pollster = "1.0.1"

# Painting runs on the CPU, so unoptimised builds are too slow to use.
# Optimise our code a little and dependencies fully; debugging still works.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
