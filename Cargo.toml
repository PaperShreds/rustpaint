[package]
name = "rustpaint"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu"] }
egui = "0.36.2"
glam = "0.34.1"
gltf = "1.4.1"
image = "0.25.10"
rfd = "0.17.2"
wgpu = "30.0.1"
